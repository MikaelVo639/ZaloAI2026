[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datamate-starter"
version = "0.1.0"
description = "Offline, reproducible starter for Zalo AI Challenge 2026 DataMate"
requires-python = ">=3.11"
dependencies = ["openpyxl==3.1.5"]

[project.scripts]
datamate = "datamate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
