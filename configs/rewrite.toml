# Experimental: the model only restates questions the grammar cannot plan; the grammar
# plans the restatement and the existing executor answers. Baseline remains the default.
backend = "rewrite"
# Fixed diagnostic score for rewrite answers, NOT a calibrated probability.
# Evaluate on train robustness splits and the seed-42 business holdout before promoting.
min_confidence = 0.5
max_seconds = 20000
model_path = "models/qwen2.5-coder-7b-instruct"
question_timeout = 30
ingestion_timeout = 300
model_load_timeout = 600
# One restatement is one short line; the prompt is the question plus a few examples.
model_timeout = 20
max_input_tokens = 4096
max_new_tokens = 128
# Retry a safe restatement once when the deterministic grammar cannot plan it.
rewrite_retries = 1
