# Rewrite, version 11: configs/rewrite-v8.toml plus the style prompt (agent/rewrite.py STYLE_PROMPT):
# name the figure with the examples' words, leave out requests and "does it exist" framings,
# keep conditions written as a closing clause and relative periods. Not measured yet: choose it
