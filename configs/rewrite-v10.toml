# Rewrite v10: keep a guard rejection when its retry returns KHONG_RO.
# Train GPU benchmark required before choosing this variant.
backend = "rewrite"
# Fixed diagnostic score for rewrite answers, NOT a calibrated probability.
min_confidence = 0.5
max_seconds = 20000
model_path = "models/qwen2.5-coder-7b-instruct"
question_timeout = 30
ingestion_timeout = 300
model_load_timeout = 600
model_timeout = 30
# Every example is in the prompt (about 5k tokens), so the input budget is larger.
max_input_tokens = 8192
max_new_tokens = 128
rewrite_retries = 1
rewrite_examples = 80
# Answer KHONG_RO only when a condition would be lost, not when no example is alike.
rewrite_lenient = true
# Spend the retry on a restatement the safety checks rejected, too.
rewrite_retry_rejected = true
# Two of three restatements must lead to the same plan (third asked only when needed).
rewrite_votes = 3
# One plannable restatement answers when the other votes restated nothing (unsure, or words
# the grammar cannot plan); a rejected or different restatement still blocks. Replaying the
# TRAIN model-benchmark restatements (LOCAL PROXY): 673 correct, 0 wrong.
rewrite_single_vote = true
rewrite_code_fallback = false
rewrite_firm_retry = true
rewrite_firm_rejected_retry = true
