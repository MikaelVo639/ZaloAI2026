name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install uv==0.12.5
      - run: uv sync --locked
      - run: uv run datamate smoke
      - run: uv run python -m unittest discover -s tests -v
      - name: Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call demo.cmd --no-pause
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m datamate demo --output data/demo
      - run: docker build --platform linux/amd64 -t datamate-starter .
      - run: mkdir -p outputs/docker/first outputs/docker/second
      - run: docker run --rm --network none --shm-size=16g --entrypoint bash -v "$PWD/data/demo:/data:ro" -v "$PWD/outputs/docker/first:/result" datamate-starter /code/predict.sh
      - run: docker run --rm --network none --shm-size=16g --entrypoint bash -v "$PWD/data/demo:/data:ro" -v "$PWD/outputs/docker/second:/result" datamate-starter /code/predict.sh
      - run: python scripts/check_demo_output.py --data-dir data/demo outputs/docker/first outputs/docker/second
